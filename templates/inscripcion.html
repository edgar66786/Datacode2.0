<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Oficial | DATA CODE 2.0 - UAdeO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        :root {
            --uadeo-guinda: #6B1226;
            --uadeo-guinda-suave: #8A1C35;
            --uadeo-dorado: #C8A14D;
            --uadeo-beige: #FAF8F5;
            --texto-principal: #2D3142;
            --texto-secundario: #6C757D;
        }
        
        body {
            background-color: var(--uadeo-beige);
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: var(--texto-principal);
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        body::before {
            content: '';
            position: fixed;
            top: -10%; 
            left: -10%; 
            width: 120vw; 
            height: 120vh;
            background-image: url("{{ url_for('static', filename='lince.png') }}");
            background-repeat: no-repeat;
            background-position: center center;
            background-size: 110vh;
            opacity: 0.08; 
            filter: blur(8px);
            z-index: -1;
        }

        .header-extendido {
            background: linear-gradient(135deg, var(--uadeo-guinda) 0%, var(--uadeo-guinda-suave) 100%);
            width: 100%;
            padding: 20px 40px;
            border-bottom: 5px solid var(--uadeo-dorado);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-logo-container {
            display: flex;
            align-items: center;
            gap: 20px;
            text-decoration: none;
        }
        .header-logo-container img {
            width: 55px;
            height: 55px;
            object-fit: contain;
            background: white;
            border-radius: 50%;
            padding: 5px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .header-titulo {
            color: white;
            font-weight: 800;
            font-size: 1.4rem;
            letter-spacing: 1px;
            margin: 0;
            text-transform: uppercase;
        }
        .header-subtitulo {
            color: var(--uadeo-dorado);
            font-size: 0.8rem;
            font-weight: 600;
            margin: 0;
            letter-spacing: 0.5px;
        }

        .tarjeta-registro {
            max-width: 520px;
            width: 100%;
            margin: 40px auto;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(107,18,38,0.08);
            background-color: rgba(255, 255, 255, 0.96);
            overflow: hidden;
            border: 1px solid rgba(107, 18, 38, 0.1);
            backdrop-filter: blur(5px);
        }
        .cabecera-tarjeta {
            background-color: var(--uadeo-guinda);
            color: white;
            padding: 30px 30px 20px;
            text-align: center;
            border-bottom: 3px solid var(--uadeo-dorado);
        }
        .logo-contenedor {
            width: 90px;
            height: 90px;
            background-color: white;
            border: 3px solid var(--uadeo-dorado);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px auto;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .logo-contenedor img {
            width: 85%;
            height: 85%;
            object-fit: contain;
        }
        .titulo-evento {
            color: var(--uadeo-dorado);
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }
        .input-group-text { background-color: #f8f9fa; border-right: none; color: var(--uadeo-guinda); }
        .form-control, .form-select { border-left: none; }
        .form-control:focus, .form-select:focus { box-shadow: none; border-color: var(--uadeo-dorado); }
        .input-group:focus-within { box-shadow: 0 0 0 0.25rem rgba(200,161,77,0.25); border-radius: 0.375rem; }
        
        .btn-uadeo {
            background-color: var(--uadeo-guinda);
            color: white;
            border: 2px solid var(--uadeo-dorado);
            transition: all 0.3s ease;
        }
        .btn-uadeo:hover {
            background-color: var(--uadeo-dorado);
            color: var(--uadeo-guinda);
            border-color: var(--uadeo-guinda);
        }
        .nav-pills .nav-link.active {
            background-color: var(--uadeo-guinda) !important;
            color: var(--uadeo-dorado) !important;
            font-weight: bold;
            border: 1px solid var(--uadeo-dorado);
        }
        .nav-pills .nav-link {
            color: var(--uadeo-guinda);
            font-weight: 600;
        }
        
        .btn-dorado {
            background-color: var(--uadeo-dorado);
            color: var(--uadeo-guinda);
            font-weight: 700;
            border: none;
            border-radius: 6px;
            padding: 8px 20px;
            transition: all 0.2s;
            text-decoration: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .btn-dorado:hover {
            background-color: #d6af59;
            color: var(--uadeo-guinda);
        }
    </style>
</head>
<body>

    <header class="header-extendido sticky-top">
        <a href="/inicio" class="header-logo-container">
            <img src="{{ url_for('static', filename='lince.png') }}" alt="Logo UAdeO" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/4/47/Logo_UADEO.png'">
            <div>
                <h1 class="header-titulo">DATA CODE 2.0</h1>
                <p class="header-subtitulo">Universidad Autónoma de Occidente — Guamúchil</p>
            </div>
        </a>
        <div>
            <a href="/inicio" class="btn btn-dorado btn-sm">
                <i class="bi bi-house-door-fill me-1"></i> Ir al Inicio
            </a>
        </div>
    </header>

    <div class="container my-auto">
        <div class="tarjeta-registro">
            <div class="cabecera-tarjeta">
                <div class="logo-contenedor">
                    <img src="{{ url_for('static', filename='lince.png') }}" alt="Lince UAdeO" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/4/47/Logo_UADEO.png'">
                </div>
                <h2 class="titulo-evento">PORTAL DE ACCESO</h2>
                <p class="mb-0 text-light fw-semibold small">Unidad Regional Guamúchil | UAdeO</p>
            </div>
            
            <div class="card-body p-4 p-md-4">
                
                {% if mensaje %}
                <div class="alert alert-danger text-center fw-bold shadow-sm py-2 small" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ mensaje }}
                </div>
                {% endif %}

                <ul class="nav nav-pills nav-fill mb-4 p-1 bg-light rounded-pill border" id="pills-tab" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active rounded-pill py-2" id="pills-registro-tab" data-bs-toggle="pill" data-bs-target="#pills-registro" type="button" role="tab">Registro</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link rounded-pill py-2" id="pills-login-tab" data-bs-toggle="pill" data-bs-target="#pills-login" type="button" role="tab">Iniciar Sesión</button>
                    </li>
                </ul>

                <div class="tab-content" id="pills-tabContent">
                    
                    <div class="tab-pane fade show active" id="pills-registro" role="tabpanel">
                        <form action="/registrar_alumno" method="POST">
                            <div class="mb-3">
                                <label class="form-label fw-bold text-secondary small">Nombre Completo</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                                    <input type="text" class="form-control" name="nombre" placeholder="Nombre del estudiante" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold text-secondary small">Matrícula Universitaria (8 Dígitos)</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-card-heading"></i></span>
                                    <input type="text" class="form-control" name="matricula" placeholder="Ej. 21010000" pattern="[0-9]{8}" minlength="8" maxlength="8" title="Debe contener exactamente 8 números" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold text-secondary small">Contraseña de Acceso (Mínimo 6 caracteres)</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-shield-lock-fill"></i></span>
                                    <input type="password" class="form-control" name="contrasena" placeholder="Mínimo 6 caracteres" minlength="6" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold text-secondary small">Unidad Regional</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-building-fill"></i></span>
                                    <select class="form-select" name="unidad_regional" required>
                                        <option value="" selected disabled>Selecciona tu unidad regional...</option>
                                        <option value="Guamúchil">Unidad Regional Guamúchil</option>
                                        <option value="Culiacán">Unidad Regional Culiacán</option>
                                        <option value="Los Mochis">Unidad Regional Los Mochis</option>
                                        <option value="Mazatlán">Unidad Regional Mazatlán</option>
                                        <option value="Guasave">Unidad Regional Guasave</option>
                                        <option value="El Fuerte">Unidad Regional El Fuerte</option>
                                        <option value="Navolato">Unidad Regional Navolato</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold text-secondary small">Turno Asignado</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-clock-fill"></i></span>
                                    <select class="form-select" name="turno" required>
                                        <option value="" selected disabled>Selecciona tu turno...</option>
                                        <option value="Matutino">Matutino</option>
                                        <option value="Vespertino">Vespertino</option>
                                    </select>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-uadeo w-100 py-3 fw-bold mt-2 text-uppercase shadow-sm">
                                <i class="bi bi-check-circle-fill me-2"></i> Finalizar Inscripción
                            </button>
                        </form>
                    </div>

                    <div class="tab-pane fade" id="pills-login" role="tabpanel">
                        <form action="/login_alumno" method="POST">
                            <div class="mb-3">
                                <label class="form-label fw-bold text-secondary small">Matrícula Universitaria</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-card-heading"></i></span>
                                    <input type="text" class="form-control" name="matricula" placeholder="Ingresa tu matrícula" pattern="[0-9]{8}" minlength="8" maxlength="8" title="Introduce una matrícula válida de 8 dígitos" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold text-secondary small">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-shield-lock-fill"></i></span>
                                    <input type="password" class="form-control" name="contrasena" placeholder="Tu contraseña" minlength="6" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-uadeo w-100 py-3 fw-bold mt-2 text-uppercase shadow-sm">
                                <i class="bi bi-box-arrow-in-right me-2"></i> Entrar a mi Panel
                            </button>
                        </form>
                    </div>

                </div>

                <div class="mt-4 pt-3 border-top text-center">
                    <button class="btn btn-sm btn-outline-secondary w-100 fw-semibold" type="button" data-bs-toggle="collapse" data-bs-target="#adminCollapse">
                        <i class="bi bi-shield-lock me-1"></i> Acceso Docentes / Jueces (Admin)
                    </button>
                    <div class="collapse mt-2" id="adminCollapse">
                        <div class="card card-body bg-dark p-3 border-0">
                            <form action="/login_admin" method="POST" class="row g-2">
                                <div class="col-8">
                                    <input type="password" class="form-control form-control-sm" name="password_admin" placeholder="Contraseña de admin..." required>
                                </div>
                                <div class="col-4">
                                    <button type="submit" class="btn btn-warning btn-sm w-100 fw-bold">Entrar</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <footer class="py-4 text-center" style="background-color: transparent; border-top: 1px solid rgba(107, 18, 38, 0.1);">
        <div class="container">
            <p class="mb-1 fw-bold text-muted">Universidad Autónoma de Occidente (UAdeO) — Unidad Regional Guamúchil</p>
            <p class="small mb-0 text-muted">Plataforma DATA CODE 2.0 © 2026</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
