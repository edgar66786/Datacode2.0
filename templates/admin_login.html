<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Restringido | Panel Administrativo UAdeO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .bg-uadeo { background-color: #7b1113 !important; }
        .text-uadeo { color: #7b1113 !important; }
        body {
            background: linear-gradient(135deg, #2c0506, #4a0a0c, #7b1113);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            overflow: hidden;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card login-card bg-white p-4 p-md-5">
                <div class="text-center mb-4">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/4/47/Logo_UADEO.png" alt="UAdeO" height="60" class="mb-3 bg-white rounded p-1 shadow-sm">
                    <h3 class="fw-bold text-uadeo">Acceso Docentes / Jueces</h3>
                    <p class="text-muted small">Introduce la contraseña institucional para administrar el comité de DATA CODE 1.0</p>
                </div>

                {% if error %}
                <div class="alert alert-danger py-2 small text-center" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ error }}
                </div>
                {% endif %}

                <form method="POST">
                    <div class="mb-4">
                        <label class="form-label text-muted fw-bold small">CONTRASEÑA DE ADMINISTRADOR</label>
                        <div class="input-group shadow-sm">
                            <span class="input-group-text bg-light text-uadeo border-0"><i class="bi bi-shield-lock-fill"></i></span>
                            <input type="password" class="form-control py-2 border-0 bg-light" name="password" placeholder="••••••••••••" required>
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-uadeo py-2 fw-bold shadow-sm">Ingresar al Panel</button>
                    </div>

                    <div class="text-center">
                        <a href="/comite" class="text-decoration-none small text-muted"><i class="bi bi-arrow-left me-1"></i> Volver a la vista de alumnos</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
